name: Validate plugins

on:
  push:
    paths:
      - "plugins/**"
      - "powers/**"
      - ".claude-plugin/**"
      - "scripts/validate-plugins.py"
      - ".github/workflows/validate-plugins.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "powers/**"
      - ".claude-plugin/**"
      - "scripts/validate-plugins.py"
      - ".github/workflows/validate-plugins.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin.json / marketplace.json / SKILL.md structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"

      - name: Run structural validation
        run: uv run --locked python scripts/validate-plugins.py
