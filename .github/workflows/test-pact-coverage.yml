name: Test pact-coverage

on:
  push:
    paths:
      - "plugins/swagger-contract-testing/skills/pact-coverage/**"
      - ".github/workflows/test-pact-coverage.yml"
  pull_request:
    paths:
      - "plugins/swagger-contract-testing/skills/pact-coverage/**"
      - ".github/workflows/test-pact-coverage.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run pact-coverage unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"

      - name: Run pytest
        run: >-
          uv run --locked pytest -v
          --cov=parse_pact_coverage
          --cov-fail-under=60
          --cov=build_filtered_oas
          --cov=async_coverage
          --cov-report=term-missing
          --cov-fail-under=75
          plugins/swagger-contract-testing/skills/pact-coverage/scripts/tests/
