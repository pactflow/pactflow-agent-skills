name: Lint

on:
  push:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff + mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.12"

      - name: Ruff lint
        run: uv run --locked ruff check scripts/ plugins/swagger-contract-testing/skills/ tests/

      - name: Ruff format check
        run: uv run --locked ruff format --check scripts/ plugins/swagger-contract-testing/skills/ tests/

      - name: mypy type check
        run: uv run --locked mypy scripts/ plugins/swagger-contract-testing/skills/ tests/
