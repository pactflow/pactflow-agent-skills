name: Security

on:
  push:
    branches:
      - main
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1

  python-audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"

      - name: Export locked generator dependencies
        run: >-
          uv export --project scripts/generate --locked --no-dev --no-emit-project
          --format requirements-txt --output-file /tmp/generator-requirements.txt

      - name: Audit dependencies
        run: uv run --locked pip-audit --disable-pip --requirement /tmp/generator-requirements.txt

  workflow-audit:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"

      - name: Run zizmor
        run: uv run --locked zizmor .