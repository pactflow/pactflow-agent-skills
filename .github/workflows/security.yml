name: Security

on:
  push:
    branches:
      - main
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

  python-audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"

      - name: Export locked generator dependencies
        run: >-
          uv export --project scripts/generate --locked --no-dev --no-emit-project
          --format requirements-txt --output-file /tmp/generator-requirements.txt

      - name: Audit dependencies
        run: uv run --locked pip-audit --disable-pip --requirement /tmp/generator-requirements.txt

  workflow-audit:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"

      - name: Run zizmor
        run: uv run --locked zizmor .