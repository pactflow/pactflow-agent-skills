name: Security

on:
  push:
    branches:
      - main
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a  # v4.8.1

  python-audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"

      - name: Export locked generator dependencies
        run: >-
          uv export --project scripts/generate --locked --no-dev --no-emit-project
          --format requirements-txt --output-file /tmp/generator-requirements.txt

      - name: Audit dependencies
        run: uv run --locked pip-audit --disable-pip --requirement /tmp/generator-requirements.txt

  workflow-audit:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"

      - name: Run zizmor
        run: uv run --locked zizmor .